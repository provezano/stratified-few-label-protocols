[project]
name = "simaudit"
version = "0.1.0"
description = "Tabular foundation models vs graph-based semi-supervised learning under label scarcity, and their combination."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.6",
    "numba>=0.60",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "openml>=0.15",
    "torch>=2.5",
    "tabpfn>=9.2",  # only ModelVersion.V2 weights are used (Apache 2.0 + attribution)
    "tabicl>=2.2",  # BSD-3
    "structured-data-models>=0.2.1",  # NVIDIA Kumo-Tabular; weights OpenMDW-1.1, synthetic-only pretraining
    "baycomp>=1.0.3",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-bdd>=7.3",
    "hypothesis>=6.100",
    "black>=24.8",
    "flake8>=7.1",
    "flake8-docstrings>=1.7",
    "flake8-cognitive-complexity>=0.1",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
    "radon>=6.0",
    "mutmut>=3.2",
    "pre-commit>=3.7",
]

[project.scripts]
simaudit = "simaudit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
bdd_features_base_dir = "tests/features"
markers = [
    "fm: runs TabPFN/TabICL inference (seconds per test)",
    "integration: needs the local OpenML cache (run `simaudit download` first)",
    "bench: performance benchmark, excluded from the default run",
]
addopts = "-ra --strict-markers -m 'not bench and not integration' --cov=src/simaudit --cov-report=term-missing --cov-report=xml --cov-report=json"

[tool.coverage.run]
source = ["src/simaudit"]
relative_files = true
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["numba.*", "openml.*", "tabpfn.*", "tabicl.*", "torch.*", "sdm.*", "baycomp.*", "scipy.*", "sklearn.*", "radon.*"]
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ["py312"]
# Audit tools committed before they ran stay byte-identical (their hash is evidence).
extend-exclude = 'tools/heldout_dedup_t1prime\.py'

[tool.mutmut]
paths_to_mutate = [
    "src/simaudit/graph/",
    "src/simaudit/data/splits.py",
    "src/simaudit/data/pool.py",
    "src/simaudit/eval/",
    "src/simaudit/analysis/",
]
tests_dir = ["tests/unit/", "tests/properties/", "tests/bdd/"]
